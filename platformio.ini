; board_build.flash_mode = qio
; board_build.arduino.memory_type = qio_qspi

; build_flags =
;     ${env.build_flags}
;     -D ARDUINO_USB_MODE=0
;     -D ARDUINO_USB_CDC_ON_BOOT=1
;     -D OPENFIRE_WIRELESS_ENABLE
;     -D OPENFIRE_WIRELESS_DEVICE_ESPNOW
;     -D ARDUINO_ESP32_S3_DEV

; =================================================
;     Common settings for all RP2040 boards
; =================================================
[common_rp2040]
platform = raspberrypi
board_build.core = earlephilhower
platform_packages =
    framework-arduinopico@https://github.com/TeamOpenFIRE/arduino-pico/archive/refs/tags/4.5.4-tusb.zip
build_flags =
    ${env.build_flags}
    -D PIO_FRAMEWORK_ARDUINO_EARLEPHILHOWER
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D F_CPU=133000000L
    -O3

; =================================================
;     Board-specific environments (RP2040)
; =================================================

[env:rpipico]
extends = env, common_rp2040
board = rpipico
board_build.filesystem_size = 64k

[env:rpipicow]
extends = env, common_rp2040
board = rpipicow
build_flags =
    ${common_rp2040.build_flags}
    -DPICO_CYW43_SUPPORTED=1
    -DCYW43_PIN_WL_DYNAMIC=1
board_build.filesystem_size = 64k

[env:adafruit_itsybitsy_rp2040]
extends = env, common_rp2040
board = adafruit_itsybitsy_rp2040
board_build.filesystem_size = 64k

[env:adafruit_kb2040]
extends = env, common_rp2040
board = adafruit_kb2040
board_build.filesystem_size = 64k

[env:arduino_nano_rp2040_connect]
extends = env, common_rp2040
board = arduino_nano_rp2040_connect
lib_deps =
    ${env.lib_deps}
    arduino-libraries/WiFiNINA @ ^1.8.14
board_build.filesystem_size = 64k

[env:waveshare_rp2040_zero]
extends = env, common_rp2040
board = waveshare_rp2040_zero
board_build.filesystem_size = 64k

[env:vccgnd_yd_rp2040]
extends = env, common_rp2040
board = vcc_gnd_yd_rp2040
board_build.filesystem_size = 1m

[env:generic_rp2040]
extends = env, common_rp2040
board = generic
board_build.filesystem_size = 1m