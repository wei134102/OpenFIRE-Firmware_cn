; PlatformIO Project Configuration File for OpenFIRE-Firmware
;
; This file is configured for various RP2040 boards based on the
; official GitHub Actions build workflow. It also includes ESP32
; configurations from a reference file.
;

[platformio]
src_dir = OpenFIREmain
default_envs = rpipico
; We don't need to include the ESP32 config file anymore as we'll define it here
;extra_configs = platformio_esp32.ini

; =================================================
;     Common settings for all environments
; =================================================
[env]
framework = arduino
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.5
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit BusIO @ ^1.14.1
    adafruit/Adafruit NeoPixel @ ^1.11.0
    lovyan03/LovyanGFX @ ^1.1.7
    adafruit/Adafruit TinyUSB Library @ ^3.7.0
    DFRobot/DFRobotIRPosition @ ^1.0.2
lib_ldf_mode = chain
lib_compat_mode = strict
monitor_speed = 115200
extra_scripts = pre:extra_script.py
build_flags =
    -std=gnu++17
    -Wno-unused-variable
    ; Add project-specific include paths
    -I OpenFIREmain
    -I OpenFIREmain/boards
    ; Common feature flags
    -D GUN
    -D PLAYER_NUMBER=1
    -D USES_DISPLAY
    -D USES_SOLENOID
    -D USES_RUMBLE
    -D MAMEHOOKER
    -D USES_ANALOG
    -D CUSTOM_NEOPIXEL
    -D DUAL_CORE
    -D USES_TEMP
    -D USE_TINYUSB
    -D USE_LOVYAN_GFX
    -D USE_SQUARE_ADVANCED
build_unflags =
    -std=gnu++11

; =================================================
;     ESP32-S3 Configuration
; =================================================
; [env:ESP32_S3_DevKitC_1]
; platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
; board = esp32-s3-devkitc-1
